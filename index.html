<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="description" content="簡單好用的手機記帳軟體，資料只存在你的裝置上。" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="記帳" />
  <title>記帳本 · 簡單記帳</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 id="topbar-title">記帳本</h1>
      <button id="theme-toggle" class="icon-btn" title="切換主題" aria-label="切換主題">🌓</button>
    </header>

    <main id="view" class="view"></main>

    <button id="fab-add" class="fab" aria-label="新增記帳">＋</button>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="home"><span class="nav-icon">🏠</span><span>首頁</span></button>
      <button class="nav-btn" data-view="list"><span class="nav-icon">📋</span><span>明細</span></button>
      <button class="nav-btn" data-view="stats"><span class="nav-icon">📊</span><span>統計</span></button>
      <button class="nav-btn" data-view="settings"><span class="nav-icon">⚙️</span><span>設定</span></button>
    </nav>
  </div>

  <div id="modal-root"></div>

  <script src="js/storage.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
